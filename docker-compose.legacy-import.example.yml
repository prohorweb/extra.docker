# One-time legacy import: mount Yii media and enable theme flags.
# Copy to docker-compose.override.yml when needed, then remove after import.
#
#   cp docker-compose.legacy-import.example.yml docker-compose.override.yml
#   docker compose up -d wordpress
#
# After import completes, delete the override and restart:
#
#   rm docker-compose.override.yml && docker compose up -d wordpress

services:
  wordpress:
    volumes:
      - ./frontend/web/img/service:/var/www/yii-service-images:ro
      - ./frontend/web/uploads:/var/www/yii-uploads:ro
    environment:
      WORDPRESS_CONFIG_EXTRA: |
        define('EXTRASPORT_DISABLE_YII_DB', false);
        define('EXTRASPORT_DISABLE_LEGACY_IMPORT', false);
