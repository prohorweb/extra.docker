# Dev overlay: Yii2 + Laravel legacy sites alongside WordPress.
#
# Legacy uses its own MariaDB (extra + extra_new from legacy/db/), separate from WP.
#
# From repo root:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d --build

services:
  nginx:
    depends_on:
      - legacy-nginx
    volumes:
      - ../nginx.legacy-proxy.conf:/etc/nginx/conf.d/legacy-proxy.conf:ro

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: extra_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - db
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root123}

  legacy-db:
    image: mariadb:11
    container_name: legacy_mariadb
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_USER: extra
      MARIADB_PASSWORD: extra123
    volumes:
      - legacy_db_data:/var/lib/mysql
      - ../legacy/db:/legacy-dumps:ro
      - ./legacy-db-init/import-legacy.sh:/docker-entrypoint-initdb.d/import-legacy.sh:ro
    ports:
      - "3307:3306"

  php:
    build:
      context: ../legacy
      dockerfile: Dockerfile
    image: extra-php:8.2-gd
    container_name: legacy_php
    command: ["php-fpm"]
    volumes:
      - ../legacy:/var/www/html
    depends_on:
      legacy-db:
        condition: service_started
    environment:
      DB_HOST: legacy-db
      DB_PORT: 3306
      DB_NAME: extra
      DB_USER: extra
      DB_PASS: extra123
    restart: unless-stopped

  laravel:
    image: extra-php:8.2-gd
    container_name: legacy_laravel
    command: ["php-fpm"]
    volumes:
      - ../legacy/laravel:/var/www/html/laravel
    working_dir: /var/www/html/laravel
    depends_on:
      legacy-db:
        condition: service_started
    environment:
      DB_HOST: legacy-db
      DB_PORT: 3306
      DB_DATABASE: extra_new
      DB_USERNAME: extra
      DB_PASSWORD: extra123
    restart: unless-stopped

  legacy-nginx:
    image: nginx:latest
    container_name: legacy_nginx
    ports:
      - "8080:80"
      - "8443:443"
      - "8090:8090"
    depends_on:
      - php
      - laravel
    volumes:
      - ../legacy:/var/www/html:ro
      - ../legacy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../docker/nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped

  node:
    image: node:22-alpine
    container_name: legacy_node
    working_dir: /app
    volumes:
      - ../legacy/laravel:/app
      - ../docker/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped

volumes:
  legacy_db_data:
