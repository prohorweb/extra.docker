# WordPress production stack (theme + infra only, no legacy mounts).
#
# Database: single `extra` / user `extra` — WordPress only.
#
# From repo root:
#   docker compose -f deploy/docker-compose.yml up -d

services:
  wordpress:
    image: wordpress:7.1-php8.2-fpm-alpine
    container_name: extra_wordpress
    command: ["php-fpm"]
    env_file:
      - ../.env
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/extrasport:/var/www/html/wp-content/themes/extrasport
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./wp-config.php:/var/www/html/wp-config.php:ro
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_PORT: 3306
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: "${WORDPRESS_DEBUG:-false}"
      WORDPRESS_DOMAIN_CURRENT_SITE: ${WORDPRESS_DOMAIN_CURRENT_SITE:-extrasport.local}
      WORDPRESS_COOKIE_DOMAIN: ${WORDPRESS_COOKIE_DOMAIN:-.local}
      WORDPRESS_LANG: ru_RU
      PHP_MEMORY_LIMIT: 256M
      PHP_MAX_UPLOAD_SIZE: 64M
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: extra_nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - wordpress
    volumes:
      - wp_core:/var/www/wordpress:ro
      - ./wp-content/themes/extrasport:/var/www/wordpress/wp-content/themes/extrasport:ro
      - ./wp-content/uploads:/var/www/wordpress/wp-content/uploads:ro
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../docker/nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped

  db:
    image: mariadb:11
    container_name: extra_mariadb
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root123}
      MARIADB_DATABASE: extra
      MARIADB_USER: extra
      MARIADB_PASSWORD: extra123
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: extra_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - db
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root123}

volumes:
  db_data:
    external: true
    name: extradocker_wp_db_data
  wp_core:
    external: true
    name: extradocker_wp_core
