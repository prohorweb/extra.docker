# ══════════════════════════════════════════
# HTTPS СЕРВЕР (443) — основной
# ══════════════════════════════════════════
server {
    listen 443 ssl http2;
    server_name extra.new piter.extra.new matros.extra.new de-vision.new www.extra.new www.de-vision.new;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ══════════════════════════════════════
    # LARAVEL — перехваченные маршруты
    # ══════════════════════════════════════
    
    location = / {
        root /var/www/html/laravel/public;
        fastcgi_pass extra_laravel:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/laravel/public/index.php;
        include fastcgi_params;
    }

    location @laravel {
        fastcgi_pass extra_laravel:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/laravel/public/index.php;
        include fastcgi_params;
    }

    # ══════════════════════════════════════
    # YII2 LEGACY — всё остальное
    # ══════════════════════════════════════
    
    root /var/www/html/frontend/web;
    index index.php;

    location /admin/ {
        alias /var/www/html/backend/web/;
        try_files $uri $uri/ @yii2-backend;
    }

    location @yii2-backend {
        rewrite ^/admin/(.*)$ /admin/index.php?r=$1&$args last;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass extra_php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

# ══════════════════════════════════════════
# HTTP → HTTPS редирект
# ══════════════════════════════════════════
server {
    listen 80;
    server_name extra.new piter.extra.new matros.extra.new de-vision.new www.extra.new www.de-vision.new;
    return 301 https://$server_name$request_uri;
}

# ══════════════════════════════════════════
# ПРЯМОЙ ДОСТУП К LARAVEL (порт 8090, HTTP)
# ══════════════════════════════════════════
server {
    listen 8090;
    server_name localhost;

    root /var/www/html/laravel/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass extra_laravel:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/laravel/public/index.php;
        include fastcgi_params;
    }
}