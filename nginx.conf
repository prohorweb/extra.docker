# WordPress Multisite — nginx (production stack)

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name extrasport.local devision.local;
    client_max_body_size 64M;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/wordpress;
    index index.php;

    # Legacy URL redirect (handled in WP theme, nginx fallback)
    location ~ ^/(es|dv)/command/?$ {
        return 301 /trainers/$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass extra_wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTPS $https if_not_empty;
    }

    location ~ /\.(ht|git) {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
