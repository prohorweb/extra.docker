# ══════════════════════════════════════════
# HTTP → HTTPS редирект (extra.new)
# ══════════════════════════════════════════
server {
    listen 80;
    server_name extra.new piter.extra.new matros.extra.new de-vision.new www.extra.new www.de-vision.new;
    return 301 https://$server_name$request_uri;
}

# ══════════════════════════════════════════
# LARAVEL — extra.new (HTTPS)
# ══════════════════════════════════════════
server {
    listen 443 ssl;
    http2 on;
    server_name extra.new piter.extra.new matros.extra.new de-vision.new www.extra.new www.de-vision.new;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/html/laravel/public;
    index index.php;

    location ^~ /webfonts/ {
        alias /var/www/html/laravel/public/webfonts/;
        expires 1y;
        access_log off;
    }

    location ^~ /build/ {
        alias /var/www/html/laravel/public/build/;
        expires 1y;
        access_log off;
    }

    location ^~ /uploads/ {
        alias /var/www/html/frontend/web/uploads/;
        expires 1y;
        access_log off;
    }

    location /@vite {
        proxy_pass https://node:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /resources {
        proxy_pass https://node:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /__vite_hmr {
        proxy_pass https://node:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /node_modules/vite {
        proxy_pass https://node:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /node_modules/.vite {
        proxy_pass https://node:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass extra_laravel:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(ht|git) {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}

# ══════════════════════════════════════════
# YII2 — extra.local (HTTP)
# ══════════════════════════════════════════
server {
    listen 80;
    server_name extra.local piter.extra.local matros.extra.local;
    client_max_body_size 32M;

    # ── Backend /admin/ ──────────────────
    location = /admin {
        return 301 $scheme://$http_host/admin/;
    }

    location /admin/ {
        alias /var/www/html/backend/web/;
        index index.php;
        try_files $uri $uri/ @backend;
    }

    location @backend {
        rewrite ^/admin/(.*)$ /admin/index.php?r=$1&$args last;
    }

    location = /admin/index.php {
        fastcgi_pass extra_php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/web/index.php;
        fastcgi_param SCRIPT_NAME     /admin/index.php;
    }

    # ── Frontend / ──────────────────────
    root /var/www/html/frontend/web;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass extra_php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(ht|git) {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}

