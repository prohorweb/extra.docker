services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    image: extra-php:8.2-gd
    container_name: extra_php
    command: ["php-fpm"]
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: extra
      DB_USER: extra
      DB_PASS: extra123
      COMPOSER_HOME: /tmp/.composer

  laravel:
    image: extra-php:8.2-gd
    container_name: extra_laravel
    command: ["php-fpm"]
    volumes:
      - ./laravel:/var/www/html/laravel   # ← было /var/www/laravel
    working_dir: /var/www/html/laravel    # ← было /var/www/laravel
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: extra_new
      DB_USERNAME: extra
      DB_PASSWORD: extra123

  wordpress:
    image: wordpress:6.4-php8.2-fpm-alpine
    container_name: extra_wordpress
    command: ["php-fpm"]
    volumes:
      - ./wordpress:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_PORT: 3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress123
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: "false"
      PHP_MEMORY_LIMIT: 256M
      PHP_MAX_UPLOAD_SIZE: 64M
    networks:
      - default

  nginx:
    image: nginx:latest
    container_name: extra_nginx
    ports:
      - "80:80"
      - "443:443"
      - "8090:8090"
    depends_on:
      - php
      - laravel
      - wordpress
    volumes:
      - ./:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
  node:
    image: node:22-alpine
    container_name: extra_node
    working_dir: /app
    volumes:
      - ./laravel:/app     # тот же код Laravel, что и в php-контейнере
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro       
    ports:
      - "5173:5173"              # порт Vite для HMR
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      CHOKIDAR_USEPOLLING: "true"  # стабильная работа вотчера в Docker на macOS
  db:
    image: mariadb:11
    container_name: extra_mariadb
    platform: linux/amd64  
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: extra_new
      MARIADB_USER: extra
      MARIADB_PASSWORD: extra123
      # WordPress database (Multisite)
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress123
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: extra_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - db
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root123
  

volumes:
  db_data: