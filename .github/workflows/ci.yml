name: CI

on:
  push:
    branches:
      - main
      - feature/wordpress
  pull_request:
    branches:
      - main
      - feature/wordpress

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-build:
    name: Build theme
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/wp-content/themes/extrasport
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/wp-content/themes/extrasport/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Verify dist output
        run: test -f assets/dist/main.js && test -f assets/dist/output.css

  compose-config:
    name: Validate compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose
        run: docker compose -f deploy/docker-compose.yml config -q

      - name: Validate dev overlay merge
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml config -q
